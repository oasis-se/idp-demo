name: Azure Sandbox Provisioning

on:
  workflow_dispatch:
    inputs:
      secret_manager_path:
        description: 'Path to secret in Secret Manager'
        required: true
        type: string
      slack_user_id:
        description: 'Slack user ID for audit trail'
        required: true
        type: string
      request_id:
        description: 'Unique request identifier'
        required: true
        type: string

permissions:
  contents: write
  id-token: write  # Required for OIDC

jobs:
  generate-manifests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      # - name: Authenticate to Google Cloud (if using GCP Secret Manager)
      #   uses: google-github-actions/auth@v1
      #   with:
      #     workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
      #     service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      
      - name: Generate resource names
        id: names
        run: |
          TIMESTAMP=$(date +%s)
          # Convert slack_user_id to lowercase and sanitize for RFC 1123 compliance
          # RFC 1123: lowercase alphanumeric, hyphens allowed, must start/end with alphanumeric
          SANITIZED_USER_ID=$(echo "${{ inputs.slack_user_id }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/-\+/-/g' | sed 's/^[^a-z0-9]*//;s/[^a-z0-9]*$//')
          # Ensure sanitized user ID is not empty (fallback to 'user')
          if [ -z "${SANITIZED_USER_ID}" ]; then
            SANITIZED_USER_ID="user"
          fi
          # Build resource name: azure-sb-{sanitized_user_id}-{timestamp}
          # Kubernetes resource names have a 63 character limit
          RESOURCE_NAME="azure-sb-${SANITIZED_USER_ID}-${TIMESTAMP}"
          # Truncate to 63 characters if needed (preserve timestamp at the end)
          if [ ${#RESOURCE_NAME} -gt 63 ]; then
            # Keep prefix and timestamp, truncate middle
            PREFIX="azure-sb-"
            MAX_USER_ID_LEN=$((63 - ${#PREFIX} - ${#TIMESTAMP} - 1))  # -1 for the hyphen
            TRUNCATED_USER_ID="${SANITIZED_USER_ID:0:$MAX_USER_ID_LEN}"
            RESOURCE_NAME="${PREFIX}${TRUNCATED_USER_ID}-${TIMESTAMP}"
          fi
          # Sanitize label values for Kubernetes compliance
          # Label values: alphanumeric, hyphens, underscores, dots; must start/end with alphanumeric; max 63 chars
          # Preserve original values as much as possible for audit purposes
          SANITIZED_SLACK_USER_ID=$(echo "${{ inputs.slack_user_id }}" | sed 's/[^a-zA-Z0-9._-]/-/g' | sed 's/-\+/-/g' | sed 's/^[^a-zA-Z0-9]*//;s/[^a-zA-Z0-9]*$//')
          # Fallback if sanitization results in empty string
          if [ -z "${SANITIZED_SLACK_USER_ID}" ]; then
            SANITIZED_SLACK_USER_ID="unknown-user"
          fi
          if [ ${#SANITIZED_SLACK_USER_ID} -gt 63 ]; then
            SANITIZED_SLACK_USER_ID="${SANITIZED_SLACK_USER_ID:0:63}"
          fi
          SANITIZED_REQUEST_ID=$(echo "${{ inputs.request_id }}" | sed 's/[^a-zA-Z0-9._-]/-/g' | sed 's/-\+/-/g' | sed 's/^[^a-zA-Z0-9]*//;s/[^a-zA-Z0-9]*$//')
          # Fallback if sanitization results in empty string
          if [ -z "${SANITIZED_REQUEST_ID}" ]; then
            SANITIZED_REQUEST_ID="unknown-request"
          fi
          if [ ${#SANITIZED_REQUEST_ID} -gt 63 ]; then
            SANITIZED_REQUEST_ID="${SANITIZED_REQUEST_ID:0:63}"
          fi
          echo "resource_name=${RESOURCE_NAME}" >> $GITHUB_OUTPUT
          echo "namespace=azure-sandboxes" >> $GITHUB_OUTPUT
          echo "sanitized_slack_user_id=${SANITIZED_SLACK_USER_ID}" >> $GITHUB_OUTPUT
          echo "sanitized_request_id=${SANITIZED_REQUEST_ID}" >> $GITHUB_OUTPUT
      
      - name: Create ExternalSecret manifest
        run: |
          mkdir -p manifests/externalsecrets
          cat > manifests/externalsecrets/${{ steps.names.outputs.resource_name }}.yaml <<EOF
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: ${{ steps.names.outputs.resource_name }}
            namespace: ${{ steps.names.outputs.namespace }}
            labels:
              app.kubernetes.io/managed-by: github-actions
              provisioned-by: slack-bot
              slack-user-id: ${{ steps.names.outputs.sanitized_slack_user_id }}
              request-id: ${{ steps.names.outputs.sanitized_request_id }}
          spec:
            refreshInterval: 1h
            secretStoreRef:
              name: google
              kind: ClusterSecretStore
            target:
              name: ${{ steps.names.outputs.resource_name }}-credentials
              creationPolicy: Owner
            data:
              - secretKey: ARM_SUBSCRIPTION_ID
                remoteRef:
                  key: ${{ inputs.secret_manager_path }}
                  property: subscriptionId
              - secretKey: ARM_TENANT_ID
                remoteRef:
                  key: ${{ inputs.secret_manager_path }}
                  property: tenantId
              - secretKey: ARM_CLIENT_ID
                remoteRef:
                  key: ${{ inputs.secret_manager_path }}
                  property: clientId
              - secretKey: ARM_CLIENT_SECRET
                remoteRef:
                  key: ${{ inputs.secret_manager_path }}
                  property: clientSecret
              - secretKey: subscription_id
                remoteRef:
                  key: ${{ inputs.secret_manager_path }}
                  property: subscriptionId
              - secretKey: tenant_id
                remoteRef:
                  key: ${{ inputs.secret_manager_path }}
                  property: tenantId
              - secretKey: client_id
                remoteRef:
                  key: ${{ inputs.secret_manager_path }}
                  property: clientId
          EOF
      
      - name: Create Crossplane Workspace manifest
        run: |
          mkdir -p manifests/workspaces
          cat > manifests/workspaces/${{ steps.names.outputs.resource_name }}.yaml <<EOF
          apiVersion: opentofu.upbound.io/v1beta1
          kind: Workspace
          metadata:
            name: ${{ steps.names.outputs.resource_name }}
            namespace: ${{ steps.names.outputs.namespace }}
            annotations:
              crossplane.io/external-name: ${{ steps.names.outputs.resource_name }}
            labels:
              app.kubernetes.io/managed-by: github-actions
              provisioned-by: slack-bot
              slack-user-id: ${{ steps.names.outputs.sanitized_slack_user_id }}
              request-id: ${{ steps.names.outputs.sanitized_request_id }}
          spec:
            forProvider:
              source: Remote
              module: git::https://github.com/OasisSecurity/Solutions-Architecture
              entrypoint: Labs/Azure/src
              
              env:
                - name: ARM_SUBSCRIPTION_ID
                  secretKeyRef:
                    namespace: ${{ steps.names.outputs.namespace }}
                    name: ${{ steps.names.outputs.resource_name }}-credentials
                    key: ARM_SUBSCRIPTION_ID
                - name: ARM_TENANT_ID
                  secretKeyRef:
                    namespace: ${{ steps.names.outputs.namespace }}
                    name: ${{ steps.names.outputs.resource_name }}-credentials
                    key: ARM_TENANT_ID
                - name: ARM_CLIENT_ID
                  secretKeyRef:
                    namespace: ${{ steps.names.outputs.namespace }}
                    name: ${{ steps.names.outputs.resource_name }}-credentials
                    key: ARM_CLIENT_ID
                - name: ARM_CLIENT_SECRET
                  secretKeyRef:
                    namespace: ${{ steps.names.outputs.namespace }}
                    name: ${{ steps.names.outputs.resource_name }}-credentials
                    key: ARM_CLIENT_SECRET
                - name: TF_VAR_subscription_id
                  secretKeyRef:
                    namespace: ${{ steps.names.outputs.namespace }}
                    name: ${{ steps.names.outputs.resource_name }}-credentials
                    key: subscription_id
                - name: TF_VAR_tenant_id
                  secretKeyRef:
                    namespace: ${{ steps.names.outputs.namespace }}
                    name: ${{ steps.names.outputs.resource_name }}-credentials
                    key: tenant_id
                - name: TF_VAR_client_id
                  secretKeyRef:
                    namespace: ${{ steps.names.outputs.namespace }}
                    name: ${{ steps.names.outputs.resource_name }}-credentials
                    key: client_id
                - name: TF_VAR_location
                  value: "East US"
            
            writeConnectionSecretToRef:
              namespace: ${{ steps.names.outputs.namespace }}
              name: ${{ steps.names.outputs.resource_name }}-outputs
          EOF
      
      # - name: Create ArgoCD Application manifest
      #   run: |
      #     cat > manifests/applications/${{ steps.names.outputs.resource_name }}-app.yaml <<EOF
      #     apiVersion: argoproj.io/v1alpha1
      #     kind: Application
      #     metadata:
      #       name: ${{ steps.names.outputs.resource_name }}
      #       namespace: argocd
      #       labels:
      #         provisioned-by: slack-bot
      #         slack-user-id: ${{ inputs.slack_user_id }}
      #     spec:
      #       project: azure-sandboxes
      #       source:
      #         repoURL: https://github.com/${{ github.repository }}
      #         targetRevision: main
      #         path: manifests
      #         directory:
      #           include: |
      #             externalsecrets/${{ steps.names.outputs.resource_name }}.yaml
      #             workspaces/${{ steps.names.outputs.resource_name }}.yaml
      #       destination:
      #         server: https://kubernetes.default.svc
      #         namespace: ${{ steps.names.outputs.namespace }}
      #       syncPolicy:
      #         automated:
      #           prune: true
      #           selfHeal: true
      #         syncOptions:
      #           - CreateNamespace=true
      #     EOF
      
      - name: Commit and push manifests
        run: |
          git config user.name "Azure Provisioning Bot"
          git config user.email "bot@example.com"
          git add manifests/
          git commit -m "Add Azure sandbox for ${{ inputs.slack_user_id }} (request: ${{ inputs.request_id }})"
          git push
      
      - name: Notify Slack (optional)
        if: always()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload: |
            status: "${{ job.status }}"
            option: "github"